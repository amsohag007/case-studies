<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}" media="screen" type="text/css">
    <link rel="stylesheet" href="{{ '/assets/css/print.css' | relative_url }}" media="print" type="text/css">
{% seo %}
  </head>

  <body>
    <header>
      <div class="inner">
        <a href="{{ '/' | relative_url }}">
          <h1>{{ site.title }}</h1>
        </a>
        <h2>{{ site.description }}</h2>
      </div>
    </header>

    <div id="content-wrapper">
      <div class="inner clearfix">
        <section id="main-content">
          {{ content }}
        </section>

        <aside id="sidebar">
          <div class="contact-card">
            <img src="{{ '/assets/images/abu-musa-profile.jpg' | relative_url }}" alt="Md. Abu Musa" width="96" height="96">
            <p class="contact-name">Md. Abu Musa</p>
            <p class="contact-role">Full-Stack Software Engineer</p>
            <ul class="contact-links">
              <li><span>Email</span><a href="mailto:amsohag007@gmail.com">amsohag007@gmail.com</a></li>
              <li><span>LinkedIn</span><a href="https://www.linkedin.com/in/abumusa007">linkedin.com/in/abumusa007</a></li>
              <li><span>GitHub</span><a href="https://github.com/amsohag007">github.com/amsohag007</a></li>
              <li><span>Portfolio</span><a href="https://abumusa-portfolio.web.app">abumusa-portfolio.web.app</a></li>
            </ul>
          </div>
        </aside>
      </div>
    </div>
  </body>
</html>
